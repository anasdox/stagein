# Production stack for a public relay.
#
# This file describes one application and nothing else. TLS, ports 80/443, the
# firewall and the certificates belong to the machine — see the `vps-infra`
# repository, which runs a shared edge that routes by hostname.
#
# The contract with that edge is three lines: join `edge`, declare a hostname
# with labels, publish no ports. Adding or removing this project never touches
# the infrastructure repository.
#
# Differences from the development compose, all deliberate:
#
#   · No ports are published. The relay is reachable through the shared edge
#     only, which is also what lets other projects share this machine.
#   · The Norns simulator is absent. On a public relay the real device dials in
#     from wherever it is (PRD §11: no inbound access to the venue). Its front
#     panel has no authentication and can arm and kill the rig — it must never
#     be exposed.
#   · NODE_ENV=production turns off unauthenticated session creation, so the
#     endpoint stops handing host tokens to whoever asks.
#
#   docker compose -f deploy/docker-compose.prod.yml up -d

name: stagein-prod

services:
  relay:
    build:
      context: ..
    image: stagein:prod
    restart: unless-stopped
    command: ["node", "packages/relay/dist/index.js"]
    # Visible to the shared edge, not to the internet.
    expose:
      - "8080"
    networks:
      - edge
    labels:
      caddy: ${STAGEIN_DOMAIN:?set STAGEIN_DOMAIN to the public hostname}
      caddy.reverse_proxy: "{{upstreams 8080}}"
      # The stage view is meant to be embedded in OBS, so framing stays open to
      # the same origin rather than denied outright.
      caddy.header.X-Frame-Options: SAMEORIGIN
      caddy.header.X-Content-Type-Options: nosniff
      caddy.header.Referrer-Policy: no-referrer
      caddy.header.Strict-Transport-Security: max-age=31536000
      caddy.encode: zstd gzip
    environment:
      NODE_ENV: production
      PORT: 8080
      PUBLIC_BASE_URL: https://${STAGEIN_DOMAIN}
      BOOTSTRAP_SESSION_ID: ${BOOTSTRAP_SESSION_ID:-LIVE01}
      BOOTSTRAP_HOST_TOKEN: ${BOOTSTRAP_HOST_TOKEN:?refusing to start with no host token}
      BOOTSTRAP_NORNS_TOKEN: ${BOOTSTRAP_NORNS_TOKEN:?refusing to start with no norns token}
      ALLOW_PUBLIC_SESSION_CREATE: ${ALLOW_PUBLIC_SESSION_CREATE:-false}
      MAX_PARTICIPANTS: ${MAX_PARTICIPANTS:-200}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

networks:
  edge:
    external: true
