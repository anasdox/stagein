[tools]
node = "22"
pnpm = "10"

[env]
_.file = { path = ".env", redact = false }
# Public VPS. Override per shell to target another machine.
VPS_HOST = "ubuntu@92.222.171.209"
# Subdomain of the wildcard zone the machine serves. The name OVH assigns to
# the VPS belongs to the machine, not to this project — the shared edge
# answers it with a 404 and claiming it here would take StageIn offline.
STAGEIN_DOMAIN = "stagein.betafactory.co"

[tasks.install]
description = "Install workspace dependencies"
run = "pnpm install"

[tasks.build]
description = "Type-check and compile every package"
depends = ["install"]
run = "pnpm -r build"

[tasks.typecheck]
description = "Type-check without emitting"
run = "pnpm -r exec tsc --noEmit"

[tasks.clean]
description = "Remove build output"
run = "rm -rf packages/*/dist packages/*/*.tsbuildinfo"

[tasks.relay]
description = "Run the relay in watch mode (http://localhost:8080)"
depends = ["build"]
run = "pnpm --filter @stagein/relay dev"

[tasks.norns]
description = "Run the Norns simulator (http://localhost:8081)"
depends = ["build"]
run = "pnpm --filter @stagein/norns-sim dev"

[tasks.dev]
description = "Run relay + Norns simulator together"
depends = ["build"]
run = "pnpm run dev"

[tasks.up]
description = "Start the full stack with docker compose"
run = "docker compose up --build"

[tasks.down]
description = "Stop the docker compose stack"
run = "docker compose down -v"

[tasks.logs]
description = "Tail docker compose logs"
run = "docker compose logs -f"

[tasks."ui-check"]
description = "Render the participant page in a DOM and assert what a person sees"
run = "node scripts/ui-check.mjs"

[tasks.smoke]
description = "End-to-end acceptance check against a running relay"
run = "node scripts/smoke.mjs"

[tasks.urls]
description = "Print the demo URLs for the bootstrap session"
run = "node scripts/urls.mjs"

# --- Norns hardware ----------------------------------------------------------

[tasks."norns:package"]
description = "Build the deployable Norns bundle into dist/norns"
run = "node scripts/norns-package.mjs"

[tasks."norns:check"]
description = "Verify the Norns bundle is complete and deployable (no hardware needed)"
depends = ["build"]
run = "node scripts/norns-check.mjs"

[tasks."norns:bridge-test"]
description = "Prove the device OSC↔WebSocket transport against a running relay"
run = "node scripts/norns-bridge-test.mjs"

[tasks."norns:deploy"]
description = "Preflight and install the script on a Norns (NORNS=we@norns.local)"
depends = ["norns:check"]
run = "node scripts/norns-deploy.mjs"

[tasks."norns:logs"]
description = "Tail the bridge log on the device"
run = "ssh ${NORNS:-we@norns.local} 'tail -f ~/dust/data/stagein/bridge.log'"

[tasks."norns:config"]
description = "Edit the device's relay URL and token"
run = "ssh -t ${NORNS:-we@norns.local} 'nano ~/dust/data/stagein/config.json'"

[tasks.demo]
description = "Play a scripted performance against the running stack"
run = "node scripts/demo.mjs"

# --- Show time ---------------------------------------------------------------
# Solo operation: every task below is one command, does one thing, and exits.

[tasks."show:start"]
description = "Bring the stack up for a show and print the URLs"
run = ["docker compose up -d --build", "node scripts/urls.mjs"]

[tasks."show:preflight"]
description = "Go / no-go before doors: address, secrets, device, latency"
run = "node scripts/show.mjs preflight"

[tasks."show:status"]
description = "One-glance state. Add --watch to follow it live"
run = "node scripts/show.mjs status"

[tasks."show:qr"]
description = "Print the join QR in the terminal"
run = "node scripts/show.mjs qr"

[tasks."show:draw"]
description = "Fire the lottery. --in <seconds> sets the countdown"
run = "node scripts/show.mjs draw"

[tasks."show:reopen"]
description = "Clear any kill, reset, and reopen registrations"
run = "node scripts/show.mjs reopen"

[tasks."show:panic"]
description = "Emergency stop from the terminal, without hunting for a browser tab"
run = "node scripts/show.mjs panic"

[tasks."show:secrets"]
description = "Generate real host and Norns tokens into .env"
run = "node scripts/show.mjs secrets"

[tasks."show:archive"]
description = "Save logs and the MIDI journal after a set"
run = "node scripts/show.mjs archive"

[tasks."show:stop"]
description = "Stop the stack (the device returns to safe values on the way out)"
run = "docker compose down"

# --- Public VPS --------------------------------------------------------------
# Only the relay is hosted. The Norns dials out to it from wherever it is.

[tasks."vps:check"]
description = "Is the VPS ready? Read-only: access, docker, DNS, ports, firewall"
run = "node scripts/vps.mjs check"

[tasks."vps:setup"]
description = "Install docker and lock the firewall down to 22/80/443 (once)"
run = "node scripts/vps.mjs setup"

[tasks."vps:deploy"]
description = "Ship, build and start the public relay, then verify over HTTPS"
depends = ["build"]
run = "node scripts/vps.mjs deploy"

[tasks."vps:status"]
description = "What is running on the VPS, and is it answering"
run = "node scripts/vps.mjs status"

[tasks."vps:logs"]
description = "Tail the public relay (append a service name to narrow it)"
run = "node scripts/vps.mjs logs"

[tasks."vps:stop"]
description = "Take the public relay down"
run = "node scripts/vps.mjs stop"
